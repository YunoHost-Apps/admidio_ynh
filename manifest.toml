#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2
id = "admidio"
name = "Admidio"
description.en = "Management system for websites of organizations and groups"
description.fr = "Application de gestion des membres d'une association, d'un groupe ou d'une organisation"
version = "5.0.15~ynh1"

maintainers = ["otm33GH"]

[upstream]
license = "GPL-2.0-only"
website = "https://www.admidio.org/"
demo = "https://www.admidio.org/demo/system/login.php"
admindoc = "https://www.admidio.org/dokuwiki/doku.php?id=en:2.0:index"
code = "https://github.com/Admidio/admidio"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "300M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/admidio"
    
    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/Admidio/admidio/archive/refs/tags/v5.0.15.tar.gz"
    sha256 = "e7d38eee36de8fe8c76609d4eedd886c4a586394fb738ce7174ddafac1664232"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]
	allow_email = true
    
    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]
    group = "www-data:rwx"
    subdirs = ["photos", "documents"]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.apt]
    packages = [
        "mariadb-server",
        "redis-server",
        "imagemagick",
        "php-pear",
        "php-db",
        "php8.5-uploadprogress",
        "php-xmlrpc",
        "php8.5-apcu",
        "php8.5-bcmath",
        "php8.5-bz2",
        "php8.5-curl",
        "php8.5-gd",
        "php8.5-gmp",
        "php8.5-igbinary",
        "php8.5-imagick",
        "php8.5-imap",
        "php8.5-intl",
        "php8.5-ldap",
        "php8.5-mbstring",
        "php8.5-redis",
        "php8.5-soap",
        "php8.5-tidy",
        "php8.5-xmlrpc",
        "php8.5-xml",
        "php8.5-zip",
        "php8.5-mysql",
        
    ]
   
    [resources.database]
    type = "mysql"
    
    [resources.composer]
    version = "2.10.2"
